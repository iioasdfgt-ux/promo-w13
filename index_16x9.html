<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 점 · 디자이너 홍보 영상 (16:9)</title>
<link rel="stylesheet" href="./에디터/stage.css">
<style>
/* ── 오늘의 점 · 30초 디자이너 홍보 영상 · 16:9(1920×1080) 데스크탑판 · 이은환 · v3 — 4:5판(index.html)과 장면 시간 · 음악은 같고 배치만 가로로
   레퍼런스: Introducing Index by Parallel — 구조 · 리듬 · 장치만 빌림(점 → 선 → 도형, 조용히 가다 터짐, 종이 + 주황 포인트)
   장면표: ../기획.md · 소스와 출처: ../소스목록.md
   음악: 곡 25초(살짝 터지는 곳)를 영상 3초에 맞춤 → offset 22 */
:root { --paper:#eeece6; --ink:#1d1a17; --or:#ef6a2c; --lav:#c8c2ec; --sky:#8fb0c6; --grn:#7d9a7a; }
#stage { font-family: PTD; background: var(--paper); }
#bg { position: absolute; inset: 0; background: var(--paper); }
#cam { position: absolute; inset: 0; transform-origin: 960px 540px; }
#grain { position: absolute; inset: -40px; pointer-events: none; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='7'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .42  0 0 0 0 .38  0 0 0 .24 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>"); }
.holes { position: absolute; top: 0; bottom: 0; width: 70px; }
.holes i { position: absolute; left: 22px; width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(29,26,23,.18); background: rgba(255,255,255,.35); }
.holes.l { left: 0; } .holes.r { right: 0; }
.L { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
#fx { position: absolute; inset: 0; pointer-events: none; }
.abs { position: absolute; }
.ball { position: absolute; border-radius: 50%; }

/* 01–02 이름 */
#tag { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 400 28px JBM; letter-spacing: .12em; color: var(--ink); }
#name { position: absolute; left: 0; right: 0; top: 420px; text-align: center; font: 800 230px/1 PTD; letter-spacing: -.02em; color: var(--ink); white-space: nowrap; }
#name > span { display: inline-block; position: relative; }
#eun .top { position: absolute; inset: 0; clip-path: inset(0 0 50% 0); }
#eun .bot { clip-path: inset(50% 0 0 0); }
#disc { position: absolute; left: 50%; top: .27em; width: .34em; height: .34em; margin: -.17em 0 0 -.17em; border-radius: 50%; background: var(--or); opacity: 0; }
#cur { position: absolute; top: 455px; width: 9px; height: 170px; background: var(--or); }

/* 질문 카드 — 글자 하나씩 통통 튀어 오른다 */
.q .no { position: absolute; left: 0; right: 0; top: 410px; text-align: center; font: 400 30px JBM; letter-spacing: .16em; }
.q .txt { position: absolute; left: 100px; right: 100px; top: 470px; text-align: center; font: 700 112px/1.2 PTD; letter-spacing: -.02em; }
.ch { display: inline-block; white-space: pre; }
.on-paper { color: var(--ink); } .on-or { color: #fff; }

/* 답 자막 */
.ans { position: absolute; left: 110px; right: 110px; font: 700 64px/1.3 PTD; letter-spacing: -.02em; }
.ans .wd { display: inline-block; white-space: pre; }

/* 04 글자들이 자리를 찾는다 */
#c04 .w { position: absolute; left: 0; top: 0; font-family: PTD; font-weight: 700; white-space: nowrap; letter-spacing: -.02em; transform-origin: 0 0; }
#c04 .gl { position: absolute; background: rgba(239,106,44,.6); }

/* 12–13 끝 */
#end .big { position: absolute; left: 200px; top: 460px; font: 400 124px/1.22 MB; letter-spacing: -.04em; color: var(--ink); }
#end .big > span { display: block; }
#end .name { position: absolute; left: 1500px; top: 560px; font: 700 56px PTD; color: var(--ink); }
#end .role { position: absolute; left: 1502px; top: 634px; font: 400 26px JBM; letter-spacing: .12em; color: #5d586f; }
#end .credit { position: absolute; left: 202px; bottom: 56px; font: 400 20px JBM; color: #6f6a82; letter-spacing: .04em; }
svg.full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div class="holes l" id="hl"></div><div class="holes r" id="hr"></div>
  <div id="cam">
  <div id="grain"></div>

  <!-- 01–02 · 0–3초 · 이름 타이핑 → '은'의 ㅇ이 주황 점이 되어 3초에 터진다 -->
  <div class="L" id="c01">
    <div id="tag">DESIGNER · 30s</div>
    <div id="name"><span id="n1">이</span><span id="eun"><span class="bot">은</span><span class="top" id="eunTop">은</span><i id="disc"></i></span><span id="n3">환</span></div>
    <div id="cur"></div>
  </div>
  <audio class="clip" src="./음원/c02_터짐종.wav" data-start="2.85" data-volume="0.8"></audio>

  <!-- 03 · Q1 — 터진 점들이 자리 잡은 뒤에 글자가 나온다 -->
  <div class="L q on-paper" id="c03"><div class="no">Q1 · DOT</div><div class="txt">처음 좋아하게 된 순간은?</div></div>

  <!-- 04 · 답 1 — 흩어진 글자들이 점을 따라 여백과 위계를 찾는다 -->
  <div class="L" id="c04">
    <div class="gl" id="gv" style="left:260px;top:130px;width:3px;height:600px"></div>
    <div class="gl" id="gh" style="left:260px;top:130px;height:3px;width:1440px"></div>
    <div class="ans" id="a1" style="top:790px;left:260px;right:60px;color:var(--ink)">배울수록,<br>여백과 위계가 보이기 시작했다</div>
  </div>

  <!-- 05 · Q2 -->
  <div class="L q on-paper" id="c05"><div class="no">Q2 · LINE</div><div class="txt">끝까지 붙드는 기준은?</div></div>

  <!-- 06 · 답 2 — 글자 아래 큰 점에서 선이 내려가고, 지나간 자리에 점이 하나씩 생긴다. 화면도 따라 내려간다 (선 · 점은 #fx) -->
  <div class="L" id="c06">
    <div class="ans" id="a2" style="top:120px;left:60px;right:60px;text-align:center;color:var(--paper)">처음 찍은 점에서 벗어나지 않는다</div>
  </div>

  <!-- 08 · Q3 (주황 바탕) -->
  <div class="L q on-or" id="c08"><div class="no">Q3 · SHAPE</div><div class="txt">가장 자신 있는 도구는?</div></div>

  <!-- 09–10 · 답 3 — 주황 화면 자체가 웹 페이지: 선 → 교차점에 점 → 점이 레이아웃이 된다 -->
  <div class="L" id="c09">
    <svg class="full" viewBox="0 0 1920 1080"><g id="wf"></g></svg>
    <div class="ans" id="a3" style="top:925px;left:60px;right:60px;text-align:center;color:#fff">점과 선이 피그마에서 화면이 된다</div>
    <div id="sheet" style="position:absolute;left:0;right:0;top:1080px;height:1080px;background:var(--paper)"></div>
  </div>
  <audio class="clip" src="./음원/c10_띠링.wav" data-start="20.5" data-volume="0.7"></audio>

  <!-- 11 · Q4 -->
  <div class="L q on-paper" id="c11"><div class="no">Q4</div><div class="txt">어떤 디자이너인가요?</div></div>

  <!-- 12–13 · 끝 — 점에서 선 → 선이 네모에 닿으면 네모가 화면 전체가 된다 → 답 + 이름 → 점 하나가 다음 선을 그으며 나간다 -->
  <div class="L" id="end">
    <svg class="full" viewBox="0 0 1920 1080">
      <line id="eLine" x1="550" y1="540" x2="550" y2="540" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
      <circle id="eDot" cx="550" cy="540" r="0" fill="var(--or)"/>
      <rect id="eShape" x="1110" y="410" width="260" height="260" rx="30" fill="var(--lav)"/>
      <line id="eOut" x1="200" y1="330" x2="200" y2="330" stroke="var(--or)" stroke-width="7" stroke-linecap="round"/>
      <circle id="eNext" cx="200" cy="330" r="0" fill="var(--or)"/>
    </svg>
    <div class="big" id="a4"><span>오늘의 점이,</span><span>내일의 선이 된다</span></div>
    <div class="name">이은환</div>
    <div class="role">DESIGNER</div>
    <div class="credit">Music &amp; SFX — Mixkit</div>
  </div>

  <!-- 장면을 넘나드는 점 · 선 · 터진 점들 -->
  <div id="fx">
    <div id="ring" class="ball" style="border:6px solid var(--or)"></div>
    <div id="pts"></div>
    <div id="line" class="abs" style="width:4px;margin-left:-2px;background:var(--paper);transform-origin:50% 0"></div>
    <div id="lds"></div>
    <div id="dot" class="ball" style="background:var(--or)"></div>
    <div id="rise" class="ball" style="background:var(--or)"></div>
  </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const Q = (sel, root = document) => [...root.querySelectorAll(sel)];
const vis = (el, t, a, b, f = .06) => { const o = Math.min(S.k(t, a, a + f), 1 - S.k(t, b - f, b)); el.style.opacity = o; return S.k(t, a, b); };
// 튀어 넘쳤다가 돌아오는 움직임 (c가 클수록 더 통통)
const back = (x, c = 1.9) => x <= 0 ? 0 : x >= 1 ? 1 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
// 같은 i면 늘 같은 값이 나오는 '가짜 난수' (Math.random 금지)
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const C = { paper: '#eeece6', ink: '#1d1a17', or: '#ef6a2c', lav: '#c8c2ec', sky: '#8fb0c6', grn: '#7d9a7a', yel: '#e9c46a', pink: '#f2c3a7' };
const mix = (a, b, x) => { const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(S.lerp(v, B[i], x))).join(',')})`; };
const place = (el, x, y, d) => { el.style.left = (x - d / 2) + 'px'; el.style.top = (y - d / 2) + 'px'; el.style.width = el.style.height = d + 'px'; };

// 글자 · 단어를 span으로 쪼갠다 (하나씩 튀어 오르게)
const split = (el, cls, byWord) => { const parts = []; el.childNodes.forEach(n => { if (n.nodeType === 3) (byWord ? n.textContent.split(/(?<= )/) : [...n.textContent]).forEach(s => parts.push(`<span class="${cls}">${s}</span>`)); else parts.push(n.outerHTML); }); el.innerHTML = parts.join(''); };
Q('.q .txt').forEach(e => split(e, 'ch'));
['a1', 'a2', 'a3'].forEach(id => split($(id), 'wd', true));
const popIn = (els, t, a, gap = .035, d = .38, dist = 50) => els.forEach((s, i) => { const x = S.k(t, a + i * gap, a + i * gap + d), p = back(x, 2.4); s.style.opacity = Math.min(1, x * 3); s.style.transform = `translateY(${(1 - p) * dist}px) scale(${S.lerp(.6, 1, p)})`; });
const qcard = (id, t, a, b, typeAt = a + .1) => { vis($(id), t, a, b, .05); popIn([$(id).querySelector('.no')], t, a, 0, .35, 20); popIn(Q('.ch', $(id)), t, typeAt, .03, .36, 60); };

// 종이 구멍
['hl', 'hr'].forEach(id => { for (let y = 40; y < 1080; y += 92) $(id).insertAdjacentHTML('beforeend', `<i style="top:${y}px"></i>`); });

// 01–02 터진 점들 — 가운데는 비워 두고 화면 가득 퍼진다 (레퍼런스 캡처 1의 밀도)
const PAL = [C.or, C.or, C.yel, C.lav, C.sky, C.pink, C.grn, C.ink];
const PTS = Array.from({ length: 170 }, (_, i) => {
  $('pts').insertAdjacentHTML('beforeend', `<div class="ball" style="background:${PAL[i % PAL.length]}"></div>`);
  return { ang: rnd(i) * Math.PI * 2, dist: 250 + Math.pow(rnd(i + 99), .7) * 1150, d: 7 + Math.pow(rnd(i + 7), 3.2) * 78, sp: .8 + rnd(i + 3) * .5 };
});

// 04 흩어진 글자 → 정리된 위계 (글자, 최종 크기, 최종 x, y)
const WORDS = [['여백', 170, 300, 160], ['위계', 116, 300, 355], ['그리드', 66, 300, 515], ['정렬', 66, 560, 515], ['자간', 46, 300, 635], ['굵기', 46, 440, 635], ['크기', 46, 580, 635], ['행간', 46, 720, 635]];
WORDS.forEach(w => $('c04').insertAdjacentHTML('beforeend', `<div class="w" style="font-size:100px">${w[0]}</div>`));

// 06 선 위에 하나씩 생기는 점
const LDS = [[440, C.lav], [640, '#ffffff'], [840, C.sky], [1040, C.yel], [1240, C.lav], [1440, '#ffffff'], [1640, C.sky], [1840, C.yel]];
LDS.forEach(() => $('lds').insertAdjacentHTML('beforeend', '<div class="ball"></div>'));

// 09–10 주황 웹 페이지 위의 선 · 점 · 레이아웃
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, at) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); $('wf').appendChild(e); return e; };
const HY = [90, 170, 450, 510, 555, 760], VX = [120, 520, 960, 1400, 1800];
const wl = [...HY.map(y => el('line', { x1: 0, y1: y, x2: 1920, y2: y, stroke: '#fff', 'stroke-width': 2, 'stroke-opacity': .55 })), ...VX.map(x => el('line', { x1: x, y1: 40, x2: x, y2: 800, stroke: '#fff', 'stroke-width': 2, 'stroke-opacity': .55 }))];
wl.forEach(l => { const L = Math.hypot(l.x2.baseVal.value - l.x1.baseVal.value, l.y2.baseVal.value - l.y1.baseVal.value); l.dataset.len = L; l.setAttribute('stroke-dasharray', L); });
const DPAL = ['#fff', C.ink, C.lav, C.sky, C.yel, C.grn];
const cross = []; HY.forEach((y, i) => VX.forEach((x, j) => cross.push({ x, y, e: el('circle', { cx: x, cy: y, r: 0, fill: DPAL[(i * 2 + j) % DPAL.length] }), a: 19.3 + rnd(i * 9 + j) * .9 })));
// 점에서 자라는 레이아웃 (x, y, w, h, 색, 자라기 시작하는 교차점)
const FILL = [
  [120, 104, 52, 52, C.ink, 120, 90], [960, 120, 300, 20, '#fff', 960, 90], [1500, 108, 300, 44, C.ink, 1400, 90],            // 네비게이션
  [120, 200, 1100, 95, C.ink, 120, 170], [120, 318, 900, 32, '#fff', 520, 170], [120, 364, 650, 32, '#fff', 520, 170],         // 큰 제목
  [1400, 190, 400, 250, C.lav, 1400, 170],                                                                                   // 이미지 자리
  [120, 412, 240, 50, '#fff', 120, 450],                                                                                      // 버튼
  [120, 578, 380, 165, C.paper, 120, 555], [560, 578, 380, 165, C.sky, 520, 555], [1000, 578, 380, 165, C.yel, 960, 555], [1440, 578, 360, 165, C.grn, 1400, 555], // 카드
].map(([x, y, w, h, c, ax, ay], i) => ({ e: el('rect', { x, y, width: w, height: h, rx: Math.min(h / 2, i === 0 ? 30 : 16), fill: c, opacity: 0 }), ax, ay, a: 20.15 + i * .07 }));

// '은'의 ㅇ 자리(무대 좌표)
function discCenter() {
  const st = $('stage').getBoundingClientRect(), r = $('disc').getBoundingClientRect(), s = st.width / 1920;
  return [(r.left + r.width / 2 - st.left) / s, (r.top + r.height / 2 - st.top) / s];
}
// 장면이 바뀔 때마다 화면이 천천히 다가온다 (카메라)
const SEG = [3, 5.5, 9.5, 11.5, 14.75, 15.2, 17.2, 22.75, 24.5, 30];

window.FILM = {
  title: '오늘의 점 (16:9)', author: '이은환', duration: 30, width: 1920, height: 1080,
  music: { src: './음원/bgm.mp3', volume: 0.6, offset: 22, fadeIn: 0.3, fadeOut: 2.5 },
  render(t) {
    // 카메라 · 종이 지글거림
    let cs = 1; for (let i = 0; i < SEG.length - 1; i++) if (t >= SEG[i] && t < SEG[i + 1]) cs = S.lerp(1, 1.035, S.k(t, SEG[i], SEG[i + 1]));
    $('cam').style.transform = t < 3 ? 'none' : `scale(${cs})`;
    const g = Math.floor(t * 12); $('grain').style.transform = `translate(${(rnd(g) - .5) * 60}px, ${(rnd(g + 5) - .5) * 60}px)`;

    // 바탕: 종이(0–11.5) → 어두운 색(11.5–15.3) → 주황(15.3–23) → 종이(23–) → 끝은 보라 네모가 화면을 덮는다
    $('bg').style.background = t < 11.5 ? C.paper : t < 14.75 ? C.ink : t < 22.75 ? C.or : C.paper;
    const paper = t < 11.5 || t >= 22.75;
    $('grain').style.opacity = paper ? 1 : .35;
    $('hl').style.opacity = $('hr').style.opacity = paper ? 1 : 0;

    // 01–02 이름 타이핑 → ㅇ이 점 → 부풀고 찌그러졌다가 3초에 시원하게 터진다
    vis($('c01'), t, 0, 3.02, .02);
    popIn([$('tag')], t, .1, 0, .4, 20);
    ['n1', 'eun', 'n3'].forEach((id, i) => { const a = .3 + i * .35, p = back(S.k(t, a, a + .3), 2.6); $(id).style.opacity = t >= a ? 1 : 0; $(id).style.transform = `translateY(${(1 - p) * 40}px)`; });
    const sr = $('stage').getBoundingClientRect(), sc = sr.width / 1920;
    // 커서는 방금 친 글자 바로 오른쪽 (글자가 나오는 순간 커서도 그 뒤로 넘어간다)
    const endEl = t < .3 ? null : t < .65 ? $('n1') : t < 1 ? $('eun') : $('n3');
    const curX = endEl ? (endEl.getBoundingClientRect().right - sr.left) / sc + 10 : ($('n1').getBoundingClientRect().left - sr.left) / sc;
    $('cur').style.left = curX + 'px';
    $('cur').style.opacity = t < 1.5 ? (Math.floor(t * 3) % 2 ? .2 : 1) : 0;
    const toDot = back(S.k(t, 1.55, 1.95), 2.2);
    $('eunTop').style.opacity = 1 - S.k(t, 1.55, 1.8);
    const swell = S.ease(S.k(t, 2.0, 2.75)), squash = Math.sin(S.k(t, 2.75, 3) * Math.PI);
    $('disc').style.opacity = t < 3 && t > 1.55 ? 1 : 0;
    $('disc').style.transform = `scale(${S.lerp(.6, 1, toDot) * S.lerp(1, 1.5, swell) * (1 + .07 * Math.sin(t * 22) * swell)}) scale(${1 + .35 * squash}, ${1 - .25 * squash})`;
    $('name').style.transform = `translateX(${t > 2.4 && t < 3 ? Math.sin(t * 90) * 3 * S.k(t, 2.4, 3) : 0}px)`;
    $('name').style.opacity = 1 - S.k(t, 2.98, 3.02);

    // 터짐: 점 170개가 한 번에 바깥으로, 충격파 링, 그다음 천천히 떠다니다 쪼그라든다
    const [cx, cy] = t < 3.05 ? discCenter() : (window.__dc || [1050, 530]);
    if (t < 3.05) window.__dc = [cx, cy];
    Q('.pt, #pts .ball').forEach((p, i) => {
      const P = PTS[i], x0 = S.k(t, 3.0, 3.0 + .5 / P.sp), b = back(x0, 1.2), drift = 1 + .05 * Math.max(0, t - 3.5);
      const r = P.dist * b * drift, gone = S.k(t, 5.0 + rnd(i + 50) * .5, 5.4 + rnd(i + 50) * .5);
      let py = cy + Math.sin(P.ang) * r * .62;
      const half = 120 + P.d / 2;                               // Q1 글자 띠(530 ± 120)는 비워 둔다
      if (Math.abs(py - 530) < half) py = 530 + Math.sign(py - 530 || 1) * half * Math.min(1, x0 * 1.5) + (py - 530) * (1 - Math.min(1, x0 * 1.5));
      place(p, cx + Math.cos(P.ang) * r * 1.35, py, P.d * S.lerp(.2, 1, Math.min(1, x0 * 2)) * (1 - gone) * (1 + .08 * Math.sin(t * 4 + i)));
      p.style.opacity = t < 3 ? 0 : 1;
    });
    const rg = S.out(S.k(t, 3.0, 3.6)); place($('ring'), cx, cy, 60 + 2400 * rg); $('ring').style.opacity = t >= 3 && t < 3.6 ? 1 - rg : 0;

    // 주인공 점: 터진 자리 → Q1 위 → 그리드 원점 → Q2 위 → 답 2 아래(선의 시작)
    const keys = [[3.0, cx, cy, 80], [3.8, 960, 340, 32], [5.5, 960, 340, 32], [6.1, 260, 130, 36], [9.4, 260, 130, 36], [10.0, 960, 340, 32], [11.5, 960, 340, 32], [11.9, 960, 250, 48]];
    let dx = keys[0][1], dy = keys[0][2], dd = keys[0][3];
    for (let i = 0; i < keys.length - 1; i++) { const [a, x0, y0, d0] = keys[i], [b, x1, y1, d1] = keys[i + 1]; if (t >= a) { const p = back(S.k(t, a, b), 1.3); dx = S.lerp(x0, x1, p); dy = S.lerp(y0, y1, p); dd = S.lerp(d0, d1, Math.min(1, p)); } }
    // 06의 선 끝(tip)과 화면이 따라 내려가는 양(pan)
    const tip = 250 + 1700 * S.k(t, 11.95, 13.95), pan = Math.max(0, tip - 820);
    const bob = t > 3.8 && t < 11.5 ? Math.sin(t * 5) * 4 : 0;
    const dotIn = back(S.k(t, 3.55, 3.85), 2.5);
    place($('dot'), dx, dy + bob - (t >= 11.9 ? pan : 0), dd * (t < 3.55 ? 0 : dotIn));
    $('dot').style.opacity = t < 14.8 ? 1 : 0;

    // 03 Q1 — 터진 점들이 자리 잡은 뒤(3.7초) 글자가 통통 올라온다
    qcard('c03', t, 3.0, 5.5, 3.7);

    // 04 답 1 — 글자들이 흩어져 돌다가 점(그리드 원점)을 따라 착 붙는다
    vis($('c04'), t, 5.5, 9.5, .1);
    Q('#c04 .w').forEach((w, i) => {
      const [, fs, fx, fy] = WORDS[i];
      const sx = 200 + rnd(i + 30) * 1400, sy = 150 + rnd(i + 60) * 620, rot = (rnd(i + 90) - .5) * 70, s0 = .38 + rnd(i + 120) * .4;
      const a = 6.2 + i * .09, p = back(S.k(t, a, a + .55), 1.6), wob = (1 - S.k(t, 5.5, a)) * Math.sin(t * 6 + i) * 18;
      w.style.transform = `translate(${S.lerp(sx, fx, p) + wob}px, ${S.lerp(sy, fy, p) - wob}px) rotate(${S.lerp(rot, 0, p)}deg) scale(${S.lerp(s0, fs / 100, p)})`;
      w.style.color = mix('#9a958c', C.ink, S.k(t, a, a + .3));
      w.style.opacity = S.k(t, 5.55 + i * .04, 5.75 + i * .04);
    });
    // 9.0–9.45초: 점에 붙은 두 선이 가운데(대각선)로 다물어지며 안의 내용을 지운다
    const shut = S.ease(S.k(t, 9.0, 9.45));
    $('gv').style.transform = `rotate(${-45 * shut}deg) scaleY(${S.out(S.k(t, 6.9, 7.4)) * (1 - S.k(t, 9.4, 9.5))})`; $('gv').style.transformOrigin = '0 0';
    $('gh').style.transform = `rotate(${45 * shut}deg) scaleX(${S.out(S.k(t, 7.0, 7.5)) * (1 - S.k(t, 9.4, 9.5))})`; $('gh').style.transformOrigin = '0 0';
    Q('#c04 .w').forEach((w, i) => {
      const [, fs, fx, fy] = WORDS[i], th = Math.atan2(fy + fs * .5 - 130, fx + fs - 260) * 180 / Math.PI;   // 점에서 본 각도
      const at = 9.0 + .45 * (th < 45 ? th / 45 : (90 - th) / 45);
      const e = S.k(t, at, at + .12);
      w.style.opacity = +w.style.opacity * (1 - e);
    });
    popIn(Q('.wd', $('a1')), t, 7.6, .07, .45, 40);
    Q('.wd', $('a1')).forEach((s, i) => { const e = S.ease(S.k(t, 9.05 + i * .03, 9.3 + i * .03)); s.style.opacity = +s.style.opacity * (1 - e); s.style.transform += ` translateY(${-30 * e}px)`; });

    // 05 Q2
    qcard('c05', t, 9.5, 11.5);

    // 06 답 2 — 글자 아래 맨 위 점(가장 큼)에서 선이 내려간다 → 지나간 자리에 점이 하나씩 톡(움직이지 않음) → 화면도 선을 따라 내려간다
    vis($('c06'), t, 11.5, 14.8, .08);
    popIn(Q('.wd', $('a2')), t, 11.5, .06, .4, 40);
    $('a2').style.transform = `translateY(${-pan}px)`;
    $('line').style.left = '960px'; $('line').style.top = (250 - pan) + 'px';
    $('line').style.height = (tip - 250) + 'px';
    $('line').style.opacity = t >= 11.95 && t < 14.8 ? 1 : 0;
    Q('#lds .ball').forEach((d, i) => {
      const [y, c] = LDS[i], p = back(S.k(tip, y, y + 110), 2.6);
      place(d, 960, y - pan, 26 * p);
      d.style.background = c; d.style.opacity = t < 14.8 ? 1 : 0;
    });

    // 07 — 주황이 아래에서 올라와 선과 점을 덮는다
    const up = S.ease(S.k(t, 13.85, 14.7));
    place($('rise'), 960, S.lerp(1080 + 300, 540, up), S.lerp(300, 3200, Math.pow(up, 1.5)));
    $('rise').style.opacity = t >= 13.85 && t < 14.85 ? 1 : 0;

    // 08 Q3 — 주황이 다 올라오자마자
    qcard('c08', t, 14.7, 17.2, 14.72);

    // 09–10 답 3 — 주황 화면이 웹 페이지: 선이 그려지고 → 교차점에 점이 톡톡 → 점에서 레이아웃이 자란다 → 살짝 스크롤
    const W0 = -0.8;   // 앞 장면이 0.8초 당겨진 만큼
    vis($('c09'), t, 17.2, 22.8, .02);
    popIn(Q('.wd', $('a3')), t, 17.3, .06, .4, 40);
    wl.forEach((l, i) => { const L = +l.dataset.len, a = 18.3 + W0 + i * .07; l.setAttribute('stroke-dashoffset', L * (1 - S.ease(S.k(t, a, a + .5)))); l.setAttribute('stroke-opacity', .55 * (1 - .6 * S.k(t, 20.6 + W0, 21.2 + W0))); });
    cross.forEach(c => { const a = c.a + W0, p = back(S.k(t, a, a + .25), 3); c.e.setAttribute('r', 11 * p * (1 - S.k(t, 20.4 + W0, 20.9 + W0))); });
    FILL.forEach(f => {
      const a = f.a + W0, p = back(S.k(t, a, a + .45), 1.7);
      f.e.setAttribute('transform', `translate(${f.ax} ${f.ay}) scale(${p}) translate(${-f.ax} ${-f.ay})`);
      f.e.setAttribute('opacity', t > a ? 1 : 0);
    });
    // 끝에 웹 페이지 전체가 위로 스크롤되어 올라가고, 아래에서 종이가 올라와 Q4로 이어진다
    const scroll = -1080 * S.ease(S.k(t, 22.3, 22.75));
    $('wf').setAttribute('transform', `translate(0 ${35 + scroll})`);
    $('a3').style.transform = $('sheet').style.transform = `translateY(${scroll}px)`;
    // 11 Q4
    qcard('c11', t, 22.75, 24.5, 22.75);

    // 12 끝 — 점 톡 → 점 아래로 선이 뻗어 네모에 닿으면 → 네모가 화면 전체가 된다
    vis($('end'), t, 24.5, 30.5, .1);
    $('eDot').setAttribute('r', 38 * back(S.k(t, 24.55, 24.85), 3));
    const sq = back(S.k(t, 24.7, 25.0), 2.5);
    const lx = S.lerp(550, 1110, S.ease(S.k(t, 24.9, 25.4)));
    $('eLine').setAttribute('x2', lx);
    const hit = S.ease(S.k(t, 25.4, 26.0));                    // 네모가 화면을 덮는다
    const nx = S.lerp(1110, -20, hit), ny = S.lerp(410, -20, hit), nw = S.lerp(260, 1960, hit), nh = S.lerp(260, 1120, hit);
    const jolt = t > 25.4 && t < 25.55 ? 1.08 : 1;
    $('eShape').setAttribute('x', nx); $('eShape').setAttribute('y', ny); $('eShape').setAttribute('width', nw * (hit ? 1 : sq) * jolt); $('eShape').setAttribute('height', nh * (hit ? 1 : sq));
    $('eShape').setAttribute('rx', S.lerp(30, 0, hit));
    Q('#a4 > span').forEach((s, i) => popIn([s], t, 26.0 + i * .3, 0, .5, 70));
    popIn([$('end').querySelector('.name')], t, 27.3, 0, .4, 30);
    popIn([$('end').querySelector('.role')], t, 27.45, 0, .4, 20);
    popIn([$('end').querySelector('.credit')], t, 27.8, 0, .4, 10);
    // 13 — 점 하나가 톡 생겨 화면 밖으로 다음 선을 긋는다
    const go = S.ease(S.k(t, 28.1, 29.5));
    $('eNext').setAttribute('r', 26 * back(S.k(t, 27.7, 28.0), 3));
    $('eNext').setAttribute('cx', S.lerp(200, 2050, go));
    $('eOut').setAttribute('x2', S.lerp(200, 2050, go));
    $('eOut').setAttribute('opacity', t >= 28.1 ? 1 : 0);
  }
};
</script>
